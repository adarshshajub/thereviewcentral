<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { margin:0; font-family:Arial; }
        .sidebar {
            width:20%; background:#111; color:#fff;
            height:100vh; position:fixed; padding:20px;
        }
        .sidebar a {
            color:#fff; display:block; margin:10px 0;
            text-decoration:none;
        }
        .content {
            margin-left:20%; padding:20px;
        }
        .cards {
            display:grid; grid-template-columns:repeat(5,1fr); gap:15px;
        }
        .card {
            background:#f4f4f4; padding:20px; text-align:center;
            border-radius:6px;
        }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:10px; border-bottom:1px solid #ddd; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>TheReviewCentral</h3>
    <hr>
    <a href="/admin-panel/">Dashboard</a>
    <a href="/admin-panel/products/">Products</a>
    <a href="/admin-panel/reviews/">Reviews</a>
    <a href="/admin-panel/articles/">Articles</a>
    <a href="/admin-panel/users/">Users</a>
    <a href="/admin-panel/clicks/">Affiliate Clicks</a>
    <hr>
    <a href="/">View Site</a>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% extends "adminpanel/base.html" %}

{% block content %}

<h2 style="color:#c0392b;">Delete Product</h2>

<div style="
    background:#fff3f3;
    border:1px solid #f5c6cb;
    padding:20px;
    max-width:500px;
">
    <p>
        Are you sure you want to permanently delete this product?
    </p>

    <p style="font-size:18px;">
        <strong>{{ product.title }}</strong>
    </p>

    <p style="color:#721c24;">
        ⚠️ This action cannot be undone.
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit"
            style="
                background:#dc3545;
                color:white;
                padding:10px 16px;
                border:none;
                cursor:pointer;
            ">
            Yes, Delete
        </button>

        <a href="{% url 'adminpanel:admin_products' %}"
           style="margin-left:15px;text-decoration:none;">
           Cancel
        </a>
    </form>
</div>

{% endblock %}
